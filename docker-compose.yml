services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tablescore
      POSTGRES_PASSWORD: tablescore
      POSTGRES_DB: tablescore
    ports:
      - "5432:5432"
    volumes:
      - tablescore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablescore -d tablescore"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  tablescore_pg:
